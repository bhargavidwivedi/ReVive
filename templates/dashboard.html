<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReVive — Clinical Intelligence Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff;}
input[type=range]{width:100%;accent-color:#7c3aed;cursor:pointer;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:#7c3aed;border-radius:3px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
{% verbatim %}
const API = window.location.origin + "/api";

const RISK_CONFIG = {
  High:   { color:"#E24B4A", bg:"rgba(226,75,74,0.15)",   emoji:"🔴" },
  Medium: { color:"#EF9F27", bg:"rgba(239,159,39,0.15)",  emoji:"🟡" },
  Low:    { color:"#1D9E75", bg:"rgba(29,158,117,0.15)",  emoji:"🟢" },
};

const FIELDS = [
  { key:"age_numeric",        label:"Age",                   min:0,  max:100, def:65 },
  { key:"time_in_hospital",   label:"Length of Stay (days)", min:1,  max:30,  def:5  },
  { key:"number_inpatient",   label:"Prior Inpatient Visits",min:0,  max:10,  def:2  },
  { key:"number_diagnoses",   label:"Diagnoses Count",       min:1,  max:20,  def:7  },
  { key:"num_medications",    label:"Medications",           min:0,  max:40,  def:12 },
  { key:"num_lab_procedures", label:"Lab Tests",             min:0,  max:100, def:40 },
  { key:"num_procedures",     label:"Procedures",            min:0,  max:10,  def:2  },
  { key:"number_emergency",   label:"Prior Emergency Visits",min:0,  max:10,  def:1  },
];

const CHECKS = [
  { key:"cardiac_primary",     label:"Cardiac primary diagnosis" },
  { key:"diabetes_primary",    label:"Diabetes primary diagnosis"},
  { key:"high_risk_discharge", label:"High-risk discharge"       },
  { key:"medication_changed",  label:"Medication changed"        },
];

const card = (children, extra={}) => (
  <div style={{background:"rgba(255,255,255,0.05)",borderRadius:16,padding:24,border:"1px solid rgba(255,255,255,0.08)",...extra}}>
    {children}
  </div>
);

const badge = (text, color) => (
  <span style={{background:`${color}22`,color,border:`1px solid ${color}44`,borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:700}}>
    {text}
  </span>
);

function App() {
  const [tab,     setTab]     = React.useState("predict");
  const [form,    setForm]    = React.useState(Object.fromEntries(FIELDS.map(f=>[f.key,f.def])));
  const [checks,  setChecks]  = React.useState(Object.fromEntries(CHECKS.map(c=>[c.key,0])));
  const [result,  setResult]  = React.useState(null);
  const [pathway, setPathway] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error,   setError]   = React.useState("");
  const [stats,   setStats]   = React.useState(null);
  const [logs,    setLogs]    = React.useState([]);
  const [health,  setHealth]  = React.useState(null);

  React.useEffect(() => {
    fetch(`${API}/stats/`).then(r=>r.json()).then(setStats).catch(()=>{});
    fetch(`${API}/logs/`).then(r=>r.json()).then(d=>setLogs(d.logs||[])).catch(()=>{});
    fetch(`${API}/system-health/`).then(r=>r.json()).then(setHealth).catch(()=>{});
  }, [result]);

  const buildPayload = () => ({
    ...form, ...checks,
    total_prior_visits:    form.number_inpatient + form.number_emergency,
    is_elderly:            form.age_numeric >= 65 ? 1 : 0,
    polypharmacy:          form.num_medications >= 5 ? 1 : 0,
    complexity_score:      +(form.number_diagnoses + form.num_medications*0.5 + form.num_lab_procedures*0.2).toFixed(2),
    los_x_diagnoses:       form.time_in_hospital * form.number_diagnoses,
    meds_x_los:            form.num_medications * form.time_in_hospital,
    elderly_x_complex:     (form.age_numeric>=65?1:0)*(form.number_diagnoses+form.num_medications*0.5),
    inpatient_x_emergency: form.number_inpatient * form.number_emergency,
    high_diagnosis_burden: form.number_diagnoses >= 5 ? 1 : 0,
    high_lab_use:          form.num_lab_procedures > 40 ? 1 : 0,
    had_procedures:        form.num_procedures > 0 ? 1 : 0,
    has_inpatient_history: form.number_inpatient >= 1 ? 1 : 0,
    emergency_prone:       form.number_emergency >= 2 ? 1 : 0,
    high_utiliser:         (form.number_inpatient+form.number_emergency) >= 3 ? 1 : 0,
  });

  const predict = async () => {
    setLoading(true); setError(""); setResult(null); setPathway(null);
    try {
      const payload = buildPayload();
      const r = await fetch(`${API}/predict/`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ patient_data: payload }),
      });
      const data = await r.json();
      setResult(data);

      // Auto-fetch care pathway
      const pr = await fetch(`${API}/care-pathway/`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ patient_data: payload, risk_level: data.risk_level }),
      });
      const pdata = await pr.json();
      setPathway(pdata);
      setTab("result");
    } catch(e) {
      setError("Cannot reach API: " + e.message);
    }
    setLoading(false);
  };

  const rc = result ? RISK_CONFIG[result.risk_level] : null;

  const TABS = [
    ["predict", "🔍 Predict"],
    ["result",  "📋 Result"],
    ["history", "📊 History"],
    ["system",  "⚙️ System"],
  ];

  return (
    <div style={{minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:"rgba(0,0,0,0.3)",backdropFilter:"blur(10px)",borderBottom:"1px solid rgba(255,255,255,0.1)",padding:"16px 32px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:32}}>🏥</span>
          <div>
            <div style={{fontSize:22,fontWeight:800,background:"linear-gradient(90deg,#a78bfa,#38bdf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>ReVive</div>
            <div style={{fontSize:11,color:"#94a3b8"}}>Clinical Intelligence Platform</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          {TABS.map(([t,l]) => (
            <button key={t} onClick={()=>setTab(t)}
              style={{padding:"8px 16px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,
                background:tab===t?"linear-gradient(135deg,#7c3aed,#2563eb)":"rgba(255,255,255,0.1)",color:"#fff"}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"24px 32px",maxWidth:1100,margin:"0 auto"}}>

        {/* Stats bar */}
        {stats && (
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
            {[
              ["Total Predictions", stats.total_predictions, "#a78bfa"],
              ["High Risk",         stats.high_risk,         "#E24B4A"],
              ["Medium Risk",       stats.medium_risk,       "#EF9F27"],
              ["Low Risk",          stats.low_risk,          "#1D9E75"],
            ].map(([label, val, color]) => (
              <div key={label} style={{background:"rgba(255,255,255,0.05)",borderRadius:12,padding:"16px",textAlign:"center",border:`1px solid ${color}33`}}>
                <div style={{fontSize:28,fontWeight:800,color}}>{val ?? 0}</div>
                <div style={{fontSize:12,color:"#94a3b8",marginTop:4}}>{label}</div>
              </div>
            ))}
          </div>
        )}

        {error && <div style={{background:"rgba(226,75,74,0.15)",border:"1px solid #E24B4A44",color:"#E24B4A",padding:"12px 20px",borderRadius:12,marginBottom:20,fontWeight:600}}>⚠️ {error}</div>}

        {/* PREDICT TAB */}
        {tab === "predict" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {card(
              <>
                <h2 style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>🎚️ Patient Parameters</h2>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                  {FIELDS.map(f => (
                    <div key={f.key}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                        <span style={{color:"#94a3b8"}}>{f.label}</span>
                        <span style={{fontWeight:700,color:"#a78bfa"}}>{form[f.key]}</span>
                      </div>
                      <input type="range" min={f.min} max={f.max} value={form[f.key]}
                        onChange={e=>setForm(p=>({...p,[f.key]:+e.target.value}))}/>
                    </div>
                  ))}
                </div>
              </>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {card(
                <>
                  <h2 style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>🏥 Clinical Flags</h2>
                  {CHECKS.map(c => (
                    <label key={c.key} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",fontSize:14,marginBottom:8}}>
                      <input type="checkbox" checked={checks[c.key]===1}
                        onChange={e=>setChecks(p=>({...p,[c.key]:e.target.checked?1:0}))}
                        style={{width:18,height:18,accentColor:"#7c3aed"}}/>
                      <span style={{color:"#cbd5e1"}}>{c.label}</span>
                    </label>
                  ))}
                </>
              )}
              <button onClick={predict} disabled={loading}
                style={{padding:"16px",borderRadius:12,border:"none",cursor:"pointer",
                  background:"linear-gradient(135deg,#7c3aed,#2563eb)",color:"#fff",fontSize:16,fontWeight:700}}>
                {loading ? "⏳ Analyzing..." : "🔍 Predict Readmission Risk"}
              </button>
            </div>
          </div>
        )}

        {/* RESULT TAB */}
        {tab === "result" && result && rc && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {card(
              <>
                <div style={{textAlign:"center",marginBottom:24}}>
                  <div style={{fontSize:64}}>{rc.emoji}</div>
                  <div style={{fontSize:56,fontWeight:800,color:rc.color}}>{result.readmission_percentage}</div>
                  <div style={{fontSize:24,fontWeight:700,color:rc.color,marginBottom:8}}>{result.risk_level} Risk</div>
                  <div style={{color:"#94a3b8",fontSize:14,marginBottom:16}}>Readmission probability within 30 days</div>
                </div>
                <h3 style={{fontSize:14,fontWeight:700,marginBottom:12,color:"#a78bfa"}}>📋 Recommendations</h3>
                {result.recommendations.map((r,i) => (
                  <div key={i} style={{display:"flex",gap:10,marginBottom:8,fontSize:13}}>
                    <span style={{color:"#7c3aed",fontWeight:700}}>{i+1}.</span>
                    <span style={{color:"#cbd5e1"}}>{r}</span>
                  </div>
                ))}
              </>
            )}
            {pathway && card(
              <>
                <h3 style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>🏥 Care Pathway</h3>
                <div style={{marginBottom:12}}>
                  {badge(pathway.overall_priority, pathway.overall_priority==="URGENT"?"#E24B4A":pathway.overall_priority==="HIGH"?"#EF9F27":"#1D9E75")}
                  <span style={{color:"#94a3b8",fontSize:12,marginLeft:8}}>Follow-up in {pathway.follow_up_in_days} days ({pathway.follow_up_date})</span>
                </div>
                {pathway.assigned_pathways?.map((p,i) => (
                  <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:8,padding:12,marginBottom:8}}>
                    <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{p.name}</div>
                    {p.actions?.slice(0,3).map((a,j) => (
                      <div key={j} style={{fontSize:12,color:"#94a3b8",marginBottom:2}}>• {a}</div>
                    ))}
                  </div>
                ))}
                <div style={{marginTop:12}}>
                  <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>Required Specialists:</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {pathway.required_specialists?.map((s,i) => (
                      <span key={i} style={{background:"rgba(124,58,237,0.2)",color:"#a78bfa",borderRadius:20,padding:"2px 10px",fontSize:11}}>{s}</span>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
        )}

        {tab === "result" && !result && (
          <div style={{textAlign:"center",padding:60,color:"#94a3b8"}}>
            <div style={{fontSize:48,marginBottom:16}}>🔍</div>
            <div>Run a prediction first to see results</div>
            <button onClick={()=>setTab("predict")} style={{marginTop:16,padding:"10px 24px",borderRadius:20,border:"none",cursor:"pointer",background:"linear-gradient(135deg,#7c3aed,#2563eb)",color:"#fff",fontWeight:600}}>
              Go to Predict
            </button>
          </div>
        )}

        {/* HISTORY TAB */}
        {tab === "history" && (
          <div>
            <h2 style={{fontSize:18,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>📊 Prediction History</h2>
            {logs.length === 0 ? (
              <div style={{textAlign:"center",padding:60,color:"#94a3b8"}}>No predictions yet. Run your first prediction!</div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {logs.map((l,i) => {
                  const rc2 = RISK_CONFIG[l.risk_level] || RISK_CONFIG.Low;
                  return (
                    <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:12,padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",border:`1px solid ${rc2.color}22`}}>
                      <div style={{display:"flex",alignItems:"center",gap:12}}>
                        <span style={{fontSize:24}}>{rc2.emoji}</span>
                        <div>
                          <div style={{fontWeight:700,color:rc2.color}}>{l.risk_level} Risk — {(l.prob*100).toFixed(1)}%</div>
                          <div style={{fontSize:12,color:"#94a3b8"}}>Age: {l.age} · LOS: {l.los} days</div>
                        </div>
                      </div>
                      <div style={{fontSize:12,color:"#64748b"}}>{new Date(l.time).toLocaleString()}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* SYSTEM TAB */}
        {tab === "system" && (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {card(
              <>
                <h2 style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>⚙️ System Health</h2>
                {health ? (
                  <div style={{display:"flex",flexDirection:"column",gap:12}}>
                    {[
                      ["Model Version",      health.model_version || "GradientBoosting"],
                      ["Baseline AUC",       health.baseline_auc || "0.6812"],
                      ["Outcomes Recorded",  health.outcomes_recorded ?? 0],
                      ["Retrain Count",      health.retraining_count ?? 0],
                      ["Drift Status",       health.drift_status || "insufficient_data"],
                      ["Last Retrain",       health.last_retrain || "Never"],
                      ["System Status",      health.system_status || "healthy"],
                    ].map(([k,v]) => (
                      <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                        <span style={{color:"#94a3b8",fontSize:13}}>{k}</span>
                        <span style={{fontWeight:700,fontSize:13,color:v==="healthy"?"#1D9E75":v==="drift_detected"?"#E24B4A":"#fff"}}>{String(v)}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{color:"#94a3b8"}}>Loading system health...</div>
                )}
              </>
            )}
            {card(
              <>
                <h2 style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#a78bfa"}}>🤖 Features Status</h2>
                {[
                  ["✅ Risk Prediction",        "Active"],
                  ["✅ Care Pathway Engine",     "Active"],
                  ["✅ Celery Task Queue",       "Active"],
                  ["✅ Redis Message Broker",    "Active"],
                  ["✅ Continuous Learning",     "Active"],
                  ["✅ Drift Detection",         "Active"],
                  ["✅ Batch Scoring",           "Active"],
                  ["⚠️ LLM Clinical Notes",     "Needs API Key"],
                  ["⚠️ FHIR/EHR Integration",   "Demo Mode"],
                ].map(([feature, status]) => (
                  <div key={feature} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                    <span style={{fontSize:13}}>{feature}</span>
                    <span style={{fontSize:12,color:status==="Active"?"#1D9E75":status==="Needs API Key"?"#EF9F27":"#94a3b8"}}>{status}</span>
                  </div>
                ))}
              </>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
{% endverbatim %}
</script>
</body>
</html>
